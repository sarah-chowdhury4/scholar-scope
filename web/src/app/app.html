<header class="topbar">
  <a routerLink="/" class="brand">ScholarScope</a>
  <span class="tagline">No source, no claim.</span>
  @if (auth.signedIn()) {
    <nav aria-label="Main">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">My scholarships</a>
      <a routerLink="/discover" routerLinkActive="active">Discover</a>
    </nav>
    <button type="button" class="link" (click)="auth.signOut()">Sign out</button>
  }
</header>
<main>
  <router-outlet />
</main>

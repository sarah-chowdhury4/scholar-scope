<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <!-- Background art for the landing hero: guideline pages with a highlighted sentence, the checklist item it
       became, and a calendar. Palette from styles.css (leaf, olive, green, surface). Decorative only. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1e6"/>
      <stop offset="1" stop-color="#d9ebc0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1d3a2b" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#sky)"/>
  <!-- soft hills -->
  <path d="M0 400 C 220 340 420 420 640 380 S 1000 320 1200 360 V480 H0Z" fill="#cbe2ad" opacity="0.55"/>
  <path d="M0 440 C 260 400 520 460 780 430 S 1060 400 1200 420 V480 H0Z" fill="#5b7a45" opacity="0.18"/>
  <circle cx="1090" cy="90" r="120" fill="#ffffff" opacity="0.35"/>

  <!-- back page -->
  <g transform="translate(760 70) rotate(-7)" filter="url(#soft)">
    <rect width="250" height="320" rx="14" fill="#f7f6f0" stroke="#dbe0d0"/>
    <rect x="28" y="34" width="120" height="12" rx="6" fill="#234f3a" opacity="0.55"/>
    <g fill="#5d6f62" opacity="0.35">
      <rect x="28" y="70" width="194" height="8" rx="4"/><rect x="28" y="90" width="170" height="8" rx="4"/>
      <rect x="28" y="110" width="186" height="8" rx="4"/><rect x="28" y="130" width="140" height="8" rx="4"/>
      <rect x="28" y="170" width="194" height="8" rx="4"/><rect x="28" y="190" width="160" height="8" rx="4"/>
      <rect x="28" y="210" width="180" height="8" rx="4"/><rect x="28" y="250" width="120" height="8" rx="4"/>
    </g>
  </g>

  <!-- front page with the quoted sentence highlighted -->
  <g transform="translate(870 110) rotate(4)" filter="url(#soft)">
    <rect width="260" height="330" rx="14" fill="#ffffff" stroke="#dbe0d0"/>
    <rect x="28" y="32" width="150" height="12" rx="6" fill="#234f3a" opacity="0.7"/>
    <g fill="#5d6f62" opacity="0.35">
      <rect x="28" y="68" width="204" height="8" rx="4"/><rect x="28" y="88" width="180" height="8" rx="4"/>
      <rect x="28" y="108" width="196" height="8" rx="4"/>
    </g>
    <rect x="20" y="132" width="222" height="44" rx="8" fill="#d9ebc0"/>
    <g fill="#234f3a" opacity="0.7">
      <rect x="30" y="142" width="196" height="8" rx="4"/><rect x="30" y="158" width="150" height="8" rx="4"/>
    </g>
    <g fill="#5d6f62" opacity="0.35">
      <rect x="28" y="196" width="200" height="8" rx="4"/><rect x="28" y="216" width="170" height="8" rx="4"/>
      <rect x="28" y="236" width="190" height="8" rx="4"/><rect x="28" y="276" width="110" height="8" rx="4"/>
    </g>
  </g>

  <!-- dotted link from the sentence to the checklist item -->
  <path d="M880 250 C 820 260 780 300 740 318" fill="none" stroke="#5b7a45" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>

  <!-- checklist card -->
  <g transform="translate(560 270)" filter="url(#soft)">
    <rect width="230" height="150" rx="14" fill="#f7f6f0" stroke="#dbe0d0"/>
    <g>
      <rect x="22" y="26" width="22" height="22" rx="6" fill="#234f3a"/>
      <path d="M27 37 l5 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="56" y="32" width="130" height="10" rx="5" fill="#1d3a2b" opacity="0.6"/>
    </g>
    <g>
      <rect x="22" y="64" width="22" height="22" rx="6" fill="#234f3a"/>
      <path d="M27 75 l5 5 l8 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="56" y="70" width="110" height="10" rx="5" fill="#1d3a2b" opacity="0.6"/>
    </g>
    <g>
      <rect x="23" y="103" width="20" height="20" rx="6" fill="#fff" stroke="#76877a" stroke-width="2"/>
      <rect x="56" y="108" width="140" height="10" rx="5" fill="#1d3a2b" opacity="0.35"/>
    </g>
  </g>

  <!-- calendar tile -->
  <g transform="translate(1040 300) rotate(6)" filter="url(#soft)">
    <rect width="120" height="120" rx="16" fill="#ffffff" stroke="#dbe0d0"/>
    <path d="M0 16 a16 16 0 0 1 16 -16 h88 a16 16 0 0 1 16 16 v20 h-120z" fill="#234f3a"/>
    <rect x="30" y="-10" width="8" height="22" rx="4" fill="#5b7a45"/>
    <rect x="82" y="-10" width="8" height="22" rx="4" fill="#5b7a45"/>
    <text x="60" y="94" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="46" font-weight="700" fill="#1d3a2b">15</text>
  </g>

  <!-- leaf sprigs -->
  <g fill="#5b7a45" opacity="0.55">
    <path d="M690 120 c 30 -40 70 -40 90 -30 c -20 30 -60 50 -90 30z"/>
    <path d="M700 150 c 10 -40 40 -60 62 -60 c -6 34 -30 60 -62 60z" opacity="0.7"/>
    <path d="M1150 230 c -30 -30 -30 -70 -18 -86 c 26 16 40 56 18 86z"/>
  </g>
  <path d="M690 120 Q 740 150 790 110" fill="none" stroke="#234f3a" stroke-width="2" opacity="0.35"/>
</svg>
